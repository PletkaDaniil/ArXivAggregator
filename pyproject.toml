[project]
name = "app"
version = "0.1.0"
description = "A system that analyzes arXiv papers based on user prompts."
authors = [
    {name = "Your_Name"}
]
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "pyTelegramBotAPI (>=4.25.0,<5.0.0)",
    "requests (>=2.31.0,<3.0.0)",
    "beautifulsoup4 (>=4.12.0,<5.0.0)",
    "sentence-transformers (>=5.0.0,<5.1.0)",
    "torch (>=2.1.0,<3.0.0)",
    "accelerate (>=1.12.0,<2.0.0)",
    "datasets (>=4.0,<5.0)",
    "PyMuPDF (>=1.24.0,<2.0.0)",
    "openai (>=1.0.0,<2.0.0)",
    "python-dotenv (>=1.0.0,<2.0.0)",
    "numpy (>=1.26,<2.0)",
    "networkx (>=3.5,<4.0)"
]

[build-system]
requires = ["poetry-core>=2.0.0,<3.0.0"]
build-backend = "poetry.core.masonry.api"
